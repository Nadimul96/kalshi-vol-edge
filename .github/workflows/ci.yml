name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Backtest the sample fixture
        run: kve backtest --fixtures data/sample
      - name: Backtest must refuse a missing fixture
        run: |
          if kve backtest --fixtures /nonexistent; then
            echo "expected a non-zero exit"; exit 1
          fi

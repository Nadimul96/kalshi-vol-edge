[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "kalshi-vol-edge"
version = "0.2.0"
description = "Kalshi 15-minute BTC bracket trading system: settlement-aware pricing, exchange-as-truth reconciliation, loud-failure backtesting, and a live dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nadimul Haque" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # numpy 2.5 dropped Python 3.11; keep 3.11 on the last release that supports it.
    "numpy>=2.4.6,<3; python_version < '3.12'",
    "numpy>=2.5.4,<3; python_version >= '3.12'",
    "httpx>=0.28.1,<1",
    "cryptography>=50.0.2",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.15.0,<3",
    "structlog>=26.1.0",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
]

[project.scripts]
kve = "kalshi_vol_edge.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "httpx2>=2.13.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_vol_edge"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/kalshi_vol_edge"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.ruff.lint.isort]
known-first-party = ["kalshi_vol_edge", "web_fakes"]
